name: New pick
description: Suggest a repo for Awesome Agent Memory
title: "Pick: "
labels: ["new pick"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository link
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: input
    id: job
    attributes:
      label: The one job it does
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Agent memory
        - RAG
        - Vector search and embeddings
        - Documents and capture
        - Second brain and LLM wikis
        - Research agents
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: Public repo with a clear license
          required: true
        - label: Works today, maintained or a finished classic
          required: true
